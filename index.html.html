<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Lista de Casamento</title>
<style>
  :root{
    --bg:#FAF7F0;
    --surface:#FFFFFF;
    --surface-2:#F1ECE0;
    --ink:#2B2A26;
    --muted:#78726A;
    --line:#E4DDCC;
    --accent:#6E7F5C;
    --accent-ink:#4B5A3C;
    --accent-soft:#E7ECDD;
    --gold:#AD8A4E;
    --gold-soft:#F4E9D3;
    --rose:#A15C52;
    --rose-soft:#F1E0DC;
    --shadow:0 1px 2px rgba(43,42,38,.06), 0 8px 24px rgba(43,42,38,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1E17;
      --surface:#22251E;
      --surface-2:#2A2D24;
      --ink:#F1EEE4;
      --muted:#B4AFA2;
      --line:#3A3D31;
      --accent:#9BB086;
      --accent-ink:#C6D6B7;
      --accent-soft:#2E3527;
      --gold:#D8B876;
      --gold-soft:#3A331E;
      --rose:#D08A7D;
      --rose-soft:#3A2823;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1E17;
    --surface:#22251E;
    --surface-2:#2A2D24;
    --ink:#F1EEE4;
    --muted:#B4AFA2;
    --line:#3A3D31;
    --accent:#9BB086;
    --accent-ink:#C6D6B7;
    --accent-soft:#2E3527;
    --gold:#D8B876;
    --gold-soft:#3A331E;
    --rose:#D08A7D;
    --rose-soft:#3A2823;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; margin:0;}
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .wrap{max-width:1120px; margin:0 auto; padding-inline:20px;}

  /* ---- topbar ---- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1120px; margin:0 auto; padding:14px 20px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; min-width:200px; flex:1 1 220px;
  }
  .search svg{flex:none; opacity:.55;}
  .search input{
    border:0; outline:0; background:transparent; color:var(--ink);
    font-size:14px; width:100%;
  }
  .search input::placeholder{color:var(--muted);}
  .pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:8px 16px; font-size:13px; cursor:pointer;
    white-space:nowrap; transition:background .15s, color .15s, border-color .15s;
  }
  .pill:hover{border-color:var(--accent);}
  .pill.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* ---- hero ---- */
  .hero{ text-align:center; padding-block:56px 28px; }
  .eyebrow{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(32px,6vw,52px); font-style:italic; font-weight:500;
    color:var(--ink); text-wrap:balance;
  }
  .hero .date{
    margin-top:10px; color:var(--muted); font-size:15px; letter-spacing:.03em;
  }
  .hero .venue{
    margin-top:6px; color:var(--muted); font-size:13.5px;
  }
  .rule{display:flex; align-items:center; justify-content:center; gap:10px; margin:22px auto;}
  .rule span{width:44px; height:1px; background:var(--line);}
  .intro{
    max-width:520px; margin:0 auto; color:var(--muted); font-size:15px; line-height:1.6;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px;
    margin-block:36px;
  }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  .card-media{
    position:relative; aspect-ratio:4/3; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card-media img{
    width:100%; height:100%; object-fit:contain; padding:10px;
    transition:filter .2s;
  }
  .card.is-reserved .card-media img{
    filter:grayscale(1); opacity:.55;
  }
  .card.is-reserved .card-name{ color:var(--muted) !important; }
  .card-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px;}
  .card-name{
    font-size:15px; font-weight:600; line-height:1.3;
  }
  .accent-0{color:var(--accent-ink);}
  .accent-1{color:var(--gold);}
  .accent-2{color:var(--rose);}
  .accent-3{color:var(--ink);}
  .card-status{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
  .dot{width:7px; height:7px; border-radius:999px; flex:none;}
  .dot-available{background:var(--accent);}
  .dot-reserved{background:var(--rose);}
  .btn-reserve{
    margin-top:4px; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--ink); color:var(--bg); border:0; border-radius:999px;
    padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:opacity .15s;
  }
  .btn-reserve:hover{opacity:.85;}
  .btn-reserve:disabled{
    background:var(--surface-2); color:var(--muted); cursor:default;
  }
  .btn-buy{
    display:flex; align-items:center; justify-content:center; gap:7px;
    background:transparent; color:var(--accent-ink); border:1px solid var(--line);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
    text-decoration:none; cursor:pointer; transition:border-color .15s;
  }
  .btn-buy:hover{border-color:var(--accent);}
  .btn-buy-disabled{color:var(--muted); cursor:default;}
  .empty{text-align:center; color:var(--muted); padding-block:40px; font-size:14px;}

  /* ---- admin ---- */
  .admin-wrap{margin-block:64px 40px; display:flex; justify-content:center;}
  .admin-card{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:24px; text-align:center; box-shadow:var(--shadow);
  }
  .admin-card.wide{max-width:760px; text-align:left;}
  .lock{
    width:36px; height:36px; border-radius:999px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
    color:var(--muted);
  }
  .admin-hint{font-size:13px; color:var(--muted); margin-bottom:16px;}
  .btn-outline{
    border:1px solid var(--line); background:transparent; color:var(--ink);
    padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-outline:hover{border-color:var(--accent);}
  .field{text-align:left; margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:9px; padding:9px 12px; font-size:14px; outline:0;
  }
  .field input:focus{border-color:var(--accent);}
  .login-actions{display:flex; gap:10px; margin-top:16px;}
  .login-actions button{flex:1;}
  .btn-solid{
    background:var(--ink); color:var(--bg); border:0; border-radius:999px;
    padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .login-error{color:var(--rose); font-size:12.5px; margin-top:-4px; margin-bottom:10px;}

  .admin-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
  .admin-top h3{font-size:18px; font-family:'Fraunces',serif; font-style:italic; font-weight:500;}
  .stats{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{
    flex:1; min-width:110px; background:var(--surface-2); border-radius:12px; padding:14px 16px;
  }
  .stat .n{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;}
  tr:last-child td{border-bottom:0;}
  .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px; border-radius:999px;
  }
  .tag-av{background:var(--accent-soft); color:var(--accent-ink);}
  .tag-res{background:var(--rose-soft); color:var(--rose);}
  .btn-link{background:none; border:0; color:var(--accent-ink); font-size:12.5px; font-weight:600; cursor:pointer; padding:0;}
  .btn-link:hover{text-decoration:underline;}

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,19,16,.5);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--surface); border-radius:16px; padding:26px; width:100%; max-width:380px;
    box-shadow:var(--shadow);
  }
  .modal h3{font-size:19px; font-style:italic; font-weight:500; margin-bottom:6px;}
  .modal p.sub{color:var(--muted); font-size:13.5px; margin-bottom:18px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px;
    font-size:13.5px; box-shadow:var(--shadow); z-index:60; max-width:90vw; text-align:center;
  }

  .alert-banner{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:var(--rose); color:#fff; padding:12px 44px 12px 18px; font-size:13.5px;
    line-height:1.4; text-align:left; box-shadow:var(--shadow);
  }
  .alert-banner .alert-close{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:transparent; border:0; color:#fff; font-size:20px; line-height:1; cursor:pointer;
    padding:6px 10px; opacity:.85;
  }
  .alert-banner .alert-close:hover{opacity:1;}
  .alert-banner-wrap{position:relative;}

  footer.foot{text-align:center; color:var(--muted); font-size:12.5px; padding-block:32px 48px;}
</style>

      return q === "" || g.name.toLowerCase().indexOf(q) !== -1;
    }).map(withReservation);
  }

  function renderCard(g, idx){
    var accent = "accent-" + (idx % 4);
    var photo = (typeof PHOTOS !== 'undefined' && PHOTOS[g.id]) || '';
    return '' +
      '<article class="card'+(g.reserved?' is-reserved':'')+'">' +
        '<div class="card-media">' +
          (photo ? '<img src="'+photo+'" alt="'+esc(g.name)+'" loading="lazy">' : '') +
        '</div>' +
        '<div class="card-body">' +
          '<p class="card-name '+accent+'">'+esc(g.name)+'</p>' +
          '<div class="card-status">' +
            '<span class="dot '+(g.reserved?'dot-reserved':'dot-available')+'"></span>' +
            '<span>'+(g.reserved?'Reservado':'Disponivel')+'</span>' +
          '</div>' +
          '<button class="btn-reserve" data-action="'+(g.reserved||!resLoaded?'noop':'open-reserve')+'" data-id="'+g.id+'" '+(g.reserved||!resLoaded?'disabled':'')+'>' +
            giftIconSmall() + '<span>'+(g.reserved?'Reservado':(resLoaded?'Reservar presente':'Carregando...'))+'</span>' +
          '</button>' +
          (g.link ?
            '<a class="btn-buy" href="'+esc(g.link)+'" target="_blank" rel="noopener">'+buyIconSmall()+'<span>Comprar presente</span></a>' :
            '<span class="btn-buy btn-buy-disabled">'+buyIconSmall()+'<span>Link em breve</span></span>'
          ) +
        '</div>' +
      '</article>';
  }

  function renderAdminLogin(){
    return '' +
      '<div class="lock">'+lockIcon()+'</div>' +
      '<h3 style="font-family:Work Sans, sans-serif; font-style:normal; font-size:16px; font-weight:600; margin-bottom:4px;">Area administrativa</h3>' +
      '<p class="admin-hint">Entre com o login e a senha para ver as reservas.</p>' +
      (UI.loginError ? '<p class="login-error">'+esc(UI.loginError)+'</p>' : '') +
      '<div class="field"><label for="adminUser">Usuario</label><input id="adminUser" type="text" autocomplete="username"></div>' +
      '<div class="field"><label for="adminPass">Senha</label><input id="adminPass" type="password" autocomplete="current-password"></div>' +
      '<div class="login-actions">' +
        '<button class="btn-outline" data-action="close-admin">Cancelar</button>' +
        '<button class="btn-solid" data-action="admin-login">Entrar</button>' +
      '</div>';
  }

  function renderAdminDashboard(){
    var giftsWithRes = STATE.gifts.map(withReservation);
    var total = giftsWithRes.length;
    var reserved = giftsWithRes.filter(function(g){return g.reserved;}).length;
    var rows = giftsWithRes.map(function(g){
      return '<tr>' +
        '<td>'+esc(g.name)+'</td>' +
        '<td>'+(g.reserved ? '<span class="tag tag-res">Reservado</span>' : '<span class="tag tag-av">Disponivel</span>')+'</td>' +
        '<td>'+(g.reserved ? esc(g.guest||'-') : '-')+'</td>' +
        '<td>'+(g.reserved ? fmtDate(g.reservedAt) : '-')+'</td>' +
        '<td>'+(g.reserved ? '<button class="btn-link" data-action="release" data-id="'+g.id+'">Liberar reserva</button>' : '')+'</td>' +
      '</tr>';
    }).join('');
    return '' +
      '<div class="admin-top">' +
        '<h3>Reservas</h3>' +
        '<button class="btn-outline" data-action="admin-logout">Sair</button>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="n">'+total+'</div><div class="l">Presentes</div></div>' +
        '<div class="stat"><div class="n">'+reserved+'</div><div class="l">Reservados</div></div>' +
        '<div class="stat"><div class="n">'+(total-reserved)+'</div><div class="l">Disponiveis</div></div>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Presente</th><th>Status</th><th>Reservado por</th><th>Data</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function renderReserveModal(){
    var g = STATE.gifts.filter(function(x){return x.id===UI.modalGiftId;})[0];
    if(!g) return '';
    return '' +
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal">' +
          '<h3>Reservar presente</h3>' +
          '<p class="sub">'+esc(g.name)+'</p>' +
          '<div class="field"><label for="guestName">Seu nome</label><input id="guestName" type="text" placeholder="Como podemos te chamar?"></div>' +
          '<div class="modal-actions">' +
            '<button class="btn-outline" data-action="close-modal">Cancelar</button>' +
            '<button class="btn-solid" data-action="confirm-reserve" data-id="'+g.id+'" '+(UI.busy?'disabled':'')+'>'+(UI.busy?'Salvando...':'Confirmar reserva')+'</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function render(){
    var gifts = filteredGifts();
    var cardsHtml = '<div class="grid">' + gifts.map(renderCard).join('') + '</div>';

    var html = '' +
      (UI.alertMsg ?
        '<div class="alert-banner-wrap"><div class="alert-banner" role="alert">'+esc(UI.alertMsg)+
          '<button class="alert-close" data-action="close-alert" aria-label="Fechar aviso">&times;</button>' +
        '</div></div>' : ''
      ) +
      '<header class="topbar"><div class="topbar-inner">' +
        '<div class="search">'+searchIcon()+'<input id="searchInput" placeholder="Buscar presente..." value="'+esc(UI.search)+'"></div>' +
      '</div></header>' +
      '<main class="wrap">' +
        '<section class="hero">' +
          '<p class="eyebrow">Lista de casamento</p>' +
          '<h1>'+esc(STATE.couple)+'</h1>' +
          '<p class="date">'+esc(STATE.weddingDate)+'</p>' +
          '<p class="venue">'+esc(STATE.venue)+' &middot; '+esc(STATE.ceremonyTime)+'</p>' +
          '<div class="rule"><span></span><svg width="7" height="7" viewBox="0 0 8 8"><rect x="1" y="1" width="6" height="6" fill="currentColor" opacity=".4" transform="rotate(45 4 4)"/></svg><span></span></div>' +
          '<p class="intro">Escolha um presente abaixo e clique em "Reservar presente". Assim evitamos presentes repetidos e vocês ajudam a gente a comecar essa nova casa com carinho.</p>' +
          '<p class="intro" style="margin-top:8px;">O botão "Comprar presente" leva você a sugestões de sites confiáveis para adquirir cada item.</p>' +
        '</section>' +
        (gifts.length===0 ? '<p class="empty">Nenhum presente encontrado.</p>' : cardsHtml) +
        '<div class="admin-wrap"><div class="admin-card '+(UI.adminOpen?'wide':'')+'">' +
          (!UI.adminOpen ? '<div class="lock">'+lockIcon()+'</div><p class="admin-hint">Area reservada aos noivos.</p><button class="btn-outline" data-action="toggle-admin">Acessar painel administrativo</button>' :
            (!UI.adminUnlocked ? renderAdminLogin() : renderAdminDashboard())
          ) +
        '</div></div>' +
      '</main>' +
      '<footer class="foot">Feito com carinho para o nosso grande dia.</footer>' +
      (UI.modalGiftId ? renderReserveModal() : '');

    var app = document.getElementById('app');
    var active = document.activeElement;
    var focusInfo = null;
    if(active && active.id){
      focusInfo = {id:active.id, start:active.selectionStart, end:active.selectionEnd};
    }
    app.innerHTML = html;
    if(focusInfo){
      var el = document.getElementById(focusInfo.id);
      if(el){
        el.focus();
        if(typeof focusInfo.start === 'number' && el.setSelectionRange){
          try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
        }
      }
    }
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.hidden = true; }, 3800);
  }

  // Persistent, non-auto-hiding banner for anything that affects whether a
  // reservation is actually saved. Stored in UI so it survives re-renders
  // and only goes away when the visitor dismisses it or a fresh attempt
  // succeeds.
  function showAlert(msg){
    UI.alertMsg = msg;
    try{ console.error('[reservas] ' + msg); }catch(e){}
    render();
  }
  function clearAlert(){
    UI.alertMsg = null;
  }

  function reserveGift(id, guestName){
    var g = STATE.gifts.filter(function(x){return x.id===id;})[0];
    if(!g || RES[id]) return;
    UI.busy = true;
    UI.modalGiftId = null;
    clearAlert();
    render();

    var payload = { guest: guestName, reservedAt: new Date().toISOString() };

    // Defensive re-check right before writing, to shrink (not fully close)
    // the window where two guests reserve the same gift at almost the same
    // moment -- the write below is the one that actually matters.
    fetch(FIREBASE_URL + '/reservations/' + id + '.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('http_' + r.status); return r.json(); })
      .then(function(existing){
        if(existing){
          RES[id] = existing;
          UI.busy = false;
          showAlert('Esse presente acabou de ser reservado por outra pessoa. Escolha outro, por favor.');
          throw {handled:true};
        }
        return fetch(FIREBASE_URL + '/reservations/' + id + '.json', {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
      })
      .then(function(r){ if(!r.ok) throw new Error('http_' + r.status); return r.json(); })
      .then(function(){
        // Re-read to confirm what actually landed (guards against a very
        // rare simultaneous write from another guest overwriting ours).
        return fetch(FIREBASE_URL + '/reservations/' + id + '.json', {cache:'no-store'}).then(function(r){ return r.json(); });
      })
      .then(function(current){
        UI.busy = false;
        RES[id] = current;
        if(current && current.guest === payload.guest && current.reservedAt === payload.reservedAt){
          render();
          showToast('Reserva confirmada! Obrigado, ' + guestName + '.');
        } else {
          render();
          showAlert('Esse presente acabou de ser reservado por outra pessoa bem na hora que voce confirmou. Escolha outro presente, por favor.');
        }
      })
      .catch(function(err){
        if(err && err.handled) return;
        UI.busy = false;
        showAlert('Nao foi possivel salvar sua reserva agora. Verifique sua internet e tente novamente. (' + (err && err.message || 'erro desconhecido') + ')');
      });
  }

  function releaseGift(id){
    if(!RES[id]) return;
    fetch(FIREBASE_URL + '/reservations/' + id + '.json', { method:'DELETE' })
      .then(function(r){ if(!r.ok) throw new Error('http_' + r.status); delete RES[id]; render(); showToast('Reserva liberada.'); })
      .catch(function(err){
        showAlert('Nao foi possivel liberar essa reserva agora. Tente de novo. (' + (err && err.message || 'erro desconhecido') + ')');
      });
  }

  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'modalOverlay'){
      UI.modalGiftId = null; render(); return;
    }
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'open-reserve'){
      UI.modalGiftId = el.dataset.id; render();
      setTimeout(function(){ var i = document.getElementById('guestName'); if(i) i.focus(); }, 0);
    } else if(action === 'close-modal'){
      UI.modalGiftId = null; render();
    } else if(action === 'confirm-reserve'){
      var nameInput = document.getElementById('guestName');
      var name = nameInput ? nameInput.value.trim() : '';
      if(!name){ if(nameInput) nameInput.focus(); return; }
      reserveGift(el.dataset.id, name);
    } else if(action === 'toggle-admin'){
      UI.adminOpen = true; render();
    } else if(action === 'close-admin'){
      UI.adminOpen = false; UI.loginError = ''; render();
    } else if(action === 'admin-login'){
      var u = document.getElementById('adminUser');
      var p = document.getElementById('adminPass');
      var uv = u ? u.value : '';
      var pv = p ? p.value : '';
      if(uv === STATE.auth.user && pv === STATE.auth.pass){
        UI.adminUnlocked = true; UI.loginError = ''; render();
      } else {
        UI.loginError = 'Usuario ou senha incorretos.'; render();
      }
    } else if(action === 'admin-logout'){
      UI.adminUnlocked = false; UI.adminOpen = false; render();
    } else if(action === 'release'){
      releaseGift(el.dataset.id);
    } else if(action === 'close-alert'){
      clearAlert(); render();
    }
  });

  document.addEventListener('input', function(e){
    if(e.target && e.target.id === 'searchInput'){
      UI.search = e.target.value; render();
    }
  });

  render();
  loadReservations();
  // Keep every open tab in sync with what other guests reserve, without
  // requiring anyone to manually refresh.
  setInterval(loadReservations, 20000);
})();
</script>
</body>
</html>
